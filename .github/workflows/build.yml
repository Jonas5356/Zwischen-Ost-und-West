# Baut den Windows-Installer.
# - Bei jedem Push auf main und manuell (Actions → "Build" → Run workflow):
#   Installer als Download unter "Artifacts" des jeweiligen Laufs.
# - Bei einem Tag "v*" (z. B. v0.1.0) zusätzlich ein Release mit dem Installer.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx tauri build

      - uses: actions/upload-artifact@v5
        with:
          name: Zwischen-Ost-und-West-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          body: "Installer `Zwischen Ost und West_*_x64-setup.exe` unten unter Assets herunterladen und ausführen."
