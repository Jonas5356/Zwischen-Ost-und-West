# Baut den Windows-Installer.
# - Bei jedem Push auf main und manuell (Actions → "Build" → Run workflow):
#   Installer als Download unter "Artifacts" des jeweiligen Laufs.
# - Gibt es zur Version aus tauri.conf.json noch kein Release v<Version>, wird es
#   automatisch angelegt und veröffentlicht – mit Installer und latest.json für den
#   Update-Knopf im Spiel. Eine neue Version erscheint also, sobald die Versionsnummer
#   erhöht und auf main gepusht wird.
# - Braucht die Secrets TAURI_SIGNING_PRIVATE_KEY und TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   (derselbe Schlüssel wie beim PDF-Tutor). Ohne sie wird nur gebaut, kein Release.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Neues Release nur auf main, mit Schlüssel und wenn es v<Version> noch nicht gibt
      - name: Release nötig?
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $neu = $false
          if ("${{ github.ref }}" -eq "refs/heads/main" -and $env:HAS_SIGNING_KEY -eq "true") {
            gh release view "v$ver" --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -ne 0) { $neu = $true }
          }
          $global:LASTEXITCODE = 0
          Write-Host "Version $ver – neues Release: $neu"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "neu=$($neu.ToString().ToLower())"

      - name: Ohne Schlüssel keine Update-Dateien
        if: env.HAS_SIGNING_KEY != 'true'
        shell: pwsh
        run: |
          $c = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $c.bundle.createUpdaterArtifacts = $false
          $c | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      # Beim Einfügen in die Secrets rutscht leicht ein Zeilenumbruch mit; hier entfernen.
      - name: Signierschlüssel bereitstellen
        if: env.HAS_SIGNING_KEY == 'true'
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $k = ($env:RAW_KEY -replace '\s', '')
          $p = "$env:RAW_PW".Trim()
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$k"
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$p"

      - name: Bauen (und bei neuer Version Release anlegen)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release.outputs.neu == 'true' && 'v__VERSION__' || '' }}
          releaseName: "Zwischen Ost und West __VERSION__"
          releaseBody: "Installer `Zwischen Ost und West_*_x64-setup.exe` unten unter Assets herunterladen und ausführen. Wer schon eine Version ab 0.3.0 installiert hat, kann im Spiel über Menü → „Nach Updates suchen“ aktualisieren."
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v5
        with:
          name: Zwischen-Ost-und-West-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
