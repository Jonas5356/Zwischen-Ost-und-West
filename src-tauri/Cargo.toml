[package]
name = "zwischen-ost-und-west"
version = "0.5.0"
description = "Historische Politiksimulation: die Bundesrepublik zwischen Ost und West, 1949–1964"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
